name: QA Deploy dgv

on:
  push:
    branches: [ "qa" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build & Push ${{ matrix.service }}
        run: |
          set -e
          owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          if [ "${{ matrix.service }}" = "frontend" ]; then
            docker build \
              -t ghcr.io/${owner_lc}/dgv-frontend:qa \
              -t ghcr.io/${owner_lc}/dgv-frontend:${{ github.sha }} \
              dgv-frontend \
              --build-arg API_PUBLIC_URL=https://qa-dgv.ned-it.de/api
            docker push ghcr.io/${owner_lc}/dgv-frontend:qa
            docker push ghcr.io/${owner_lc}/dgv-frontend:${{ github.sha }}
          else
            docker build \
              -t ghcr.io/${owner_lc}/dgv-backend:qa \
              -t ghcr.io/${owner_lc}/dgv-backend:${{ github.sha }} \
              dgv-backend
            docker push ghcr.io/${owner_lc}/dgv-backend:qa
            docker push ghcr.io/${owner_lc}/dgv-backend:${{ github.sha }}
          fi

    deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" -p "${{ secrets.GHCR_TOKEN }}"
            cd /srv/docker/qa/dgv/compose
            docker compose pull
            docker compose up -d

            # auf DB warten
            for i in $(seq 1 30); do
              docker exec qa-dgv-db sh -lc 'mysqladmin ping -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' && break
              sleep 2
            done

            # Tabellen idempotent anlegen (ohne Heredoc)
            docker exec qa-dgv-db sh -lc 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "CREATE TABLE IF NOT EXISTS firmen (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(190) NOT NULL, adresse VARCHAR(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"'
            docker exec qa-dgv-db sh -lc 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "CREATE TABLE IF NOT EXISTS benutzerdaten (id INT AUTO_INCREMENT PRIMARY KEY, vorname VARCHAR(100) NOT NULL, nachname VARCHAR(100) NOT NULL, wunschposition VARCHAR(190), firmaId INT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, CONSTRAINT fk_benutzerdaten_firma FOREIGN KEY (firmaId) REFERENCES firmen(id) ON DELETE SET NULL ON UPDATE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"'

